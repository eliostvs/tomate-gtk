name: test

on:
  push:
    branches:
      - main
      - develop
  pull_request: 
  workflow_dispatch: 

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: eliostvs/tomate

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libglib2.0-dev pkg-config

      - name: Set up Task
        uses: go-task/setup-task@v1

      - name: Create development environment
        run: task dev

      - name: Create mime database
        run: task mime

      - name: Test
        run: task test
