name: release

on:
  push:
    branches:
      - master
    paths:
      - 'data/**'
      - 'tomate/**'
      - 'setup.py'
      - '.bumpversion.cfg'

concurrency:
  group: ${{ github.workflow }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Task
        uses: go-task/setup-task@v1

      - name: Trigger build
        env:
          TOKEN: ${{ secrets.OBS_TOKEN }}
        run: task trigger
