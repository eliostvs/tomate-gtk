name: lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch: 

jobs:
  lint:
    name: Run Statick Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            gir1.2-gstreamer-1.0 \
            gir1.2-gtk-3.0 \
            gir1.2-notify-0.7 \
            gir1.2-playerctl-2.0 \
            python3-gi \
            python3-wrapt \
            python3-xdg \
            python3-yapsy \
            libdbus-1-dev \
            libglib2.0-dev \
            pkg-config

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
          enable-cache: true

      - name: Create development environment
        run: uv venv --clear --system-site-packages --python python3 .venv

      - name: Set up Task
        uses: go-task/setup-task@v1

      - name: Sync development dependencies
        run: uv sync --group dev

      - name: Run lint
        run: task lint

      - name: Run typecheck
        run: task typecheck
